/*

//Specify the marquee's width (in pixels)
var marqueewidth="275px"
//Specify the marquee's height
var marqueeheight="630px"
//Specify the marquee's marquee speed (larger is faster 1-10)
var marqueespeed=1
//Specify initial pause before scrolling in milliseconds
var initPause=1000
//Specify start with Full(1)or Empty(0) Marquee
var full=1
//Pause marquee onMousever (0=no 1=yes)?
var pauseit=1
//Specify images' border
imgBorder=0

var photos=new Array();
//Specify images, optional link, optional target:





photos[0]=['banners/cowgirltuff.png', 'https://www.cowgirltuff.com/', '_blank']
photos[1]=['banners/26koolspeed.png', '', '_blank']


photos[2]=['banners/drinkingpost.png', 'https://www.dpwaterer.com', '_blank']
photos[3]=['banners/mvp.png', 'http://www.medvetpharm.com', '_blank']
photos[4]=['banners/legendtack.png', 'https://legendtackandsilver.com/index.html', '_blank']
photos[5]=['banners/brif.png', 'https://www.barrelbash.com/brif/', '_blank']
photos[6]=['banners/rbarrelhorses.png', 'https://www.facebook.com/RBarrelHorses/', '_blank']
photos[7]=['banners/futurefortunes.png', 'http://www.futurefortunesinc.com', '_blank']
photos[8]=['banners/sss.png', 'http://www.selectstallionstakes.com', '_blank']
photos[9]=['banners/cep.png', 'https://completeequineperformance.com', '_blank']
photos[10]=['banners/myers.png', '', '_blank']

photos[11]=['banners/benthalo.png', '', '_blank']
photos[12]=['banners/performancestallmat.jpg', 'https://www.openstalls.com/reservation/1957/stalls', '_blank']
photos[13]=['banners/luckychuck.png', 'http://luckychuck.com', '_blank']

photos[14]=['banners/competitivechiro.png', '', '_blank']
photos[15]=['banners/26tophandbrand.png', 'https://www.tophandbrand.com', '_blank']
photos[16]=['banners/equiresp.png', '', '_blank']
photos[17]=['banners/pbrip.png', '', '_blank']
photos[18]=['banners/gpk.png', 'https://www.greatplainskubota.com/', '_blank']

photos[19]=['banners/hhabanner.png', 'https://www.facebook.com/hellshalfacre', '_blank']
photos[20]=['banners/26hart.png', 'https://harttrailer.com/', '_blank']

photos[21]=['banners/26oktraileroutlet.png', 'https://www.oktraileroutlet.com/', '_blank']
////NO NEED TO EDIT BELOW THIS LINE////////////
var preload=new Array()
for (var i_tem = 0; i_tem < photos.length; i_tem++){
preload[i_tem]=new Image()
preload[i_tem].src=photos[i_tem][0]
}

var actualheight=marqueecontent=''
var copyspeed=marqueespeed
var pausespeed=(pauseit)? 0 : copyspeed
var iedom=document.all||document.getElementById
var cross_marquee, cross_marquee2, ns_marquee

for (var i_tem = 0; i_tem < photos.length; i_tem++){
if (typeof photos[i_tem][1]!=='undefined'){
marqueecontent+='<a href="'+photos[i_tem][1]+'"'
marqueecontent+=typeof photos[i_tem][2]!=='undefined'? ' target="'+photos[i_tem][2]+'"' : ''
marqueecontent+='>'
}
marqueecontent+='<img src="'+photos[i_tem][0]+'" alt="Image #'+[i_tem+1]+'" border="'+imgBorder+'"><br>'
marqueecontent+=typeof photos[i_tem][1]!=='undefined'? '</a>' : ''
}
if (iedom||document.layers){
with (document){
if (iedom){
write('<div style="overflow:hidden;"><div style="position:relative;width:'+marqueewidth+';height:'+marqueeheight+';overflow:hidden" onMouseover="copyspeed=pausespeed" onMouseout="copyspeed=marqueespeed">')
write('<div id="iemarquee" style="position:absolute;left:0px;top:0px;width:100%;"><table align="center"><tr><td height="'+marqueeheight+'" align="center" valign="middle">Loading . . .</td></tr></table>')
write('</div><div id="iemarquee2" style="position:absolute;left:0px;top:0px;width:100%;">')
write('</div></div></div>')
}
else if (document.layers){
write('<ilayer width='+marqueewidth+' height='+marqueeheight+' name="ns_marquee">')
write('<layer name="ns_marquee2" width='+marqueewidth+' height='+marqueeheight+' left=0 top=0 onMouseover="copyspeed=pausespeed" onMouseout="copyspeed=marqueespeed"></layer>')
write('</ilayer>')
}
}
}

function populate(){
if (document.all)
for (var i_tem = 0; i_tem < preload.length; i_tem++)
if (typeof preload[i_tem].complete=='boolean'&&!preload[i_tem].complete){
setTimeout("populate();", 2000)
return;
}
if (iedom){
cross_marquee=document.getElementById? document.getElementById("iemarquee") : document.all.iemarquee
cross_marquee2=document.getElementById? document.getElementById("iemarquee2") : document.all.iemarquee2
cross_marquee.style.top=(full==1)? '0px' : parseInt(marqueeheight)+0+"px"
cross_marquee2.innerHTML=cross_marquee.innerHTML=marqueecontent
actualheight=cross_marquee.offsetHeight
cross_marquee2.style.top=(parseInt(cross_marquee.style.top)+actualheight+0)+"px" //indicates following #1
}
else if (document.layers){
ns_marquee=document.ns_marquee.document.ns_marquee2
ns_marquee.top=parseInt(marqueeheight)+8
ns_marquee.document.write(marqueecontent)
ns_marquee.document.close()
actualheight=ns_marquee.document.height
}
setTimeout('lefttime=setInterval("scrollmarquee()",20)',initPause)
}
window.onload=populate

function scrollmarquee(){

if (iedom){
if (parseInt(cross_marquee.style.top)<(actualheight*(-1)))
cross_marquee.style.top=(parseInt(cross_marquee2.style.top)+actualheight)+"px"
if (parseInt(cross_marquee2.style.top)<(actualheight*(-1)))
cross_marquee2.style.top=(parseInt(cross_marquee.style.top)+actualheight)+"px"
cross_marquee2.style.top=parseInt(cross_marquee2.style.top)-copyspeed+"px"
cross_marquee.style.top=parseInt(cross_marquee.style.top)-copyspeed+"px"
}

else if (document.layers){
if (ns_marquee.top>(actualheight*(-1)+8))
ns_marquee.top-=copyspeed
else
ns_marquee.top=parseInt(marqueeheight)+8
}
}
</script>
